<!-- Slide component: Supports de Com Artwork 2 (Static slide using 7-card grid layout) -->
<div class="slide relative w-[1920px] h-[1080px] overflow-hidden bg-[var(--color-background)]" style="font-family: var(--font-body);">

  <!-- Decorative line above title -->
  <div class="absolute left-[78px] top-[50px] w-[580px] h-[3px] bg-[var(--color-text-primary)] z-10"></div>

  <!-- Slide Header -->
  <h1 class="absolute left-[78px] top-[68px] z-10 text-5xl font-bold leading-[1.05]" style="font-family: var(--font-heading);">
    <span class="text-[var(--color-text-primary)]" data-field="title">SUPPORTS DE COM ARTWORK 2</span>
  </h1>
  <svg width="300" height="24" viewBox="0 0 300 24" xmlns="http://www.w3.org/2000/svg" class="absolute left-[78px] top-[125px] z-10">
    <path d="M0,18 C75,7 225,7 300,18"
          fill="none"
          stroke="var(--color-text-primary)"
          stroke-width="13"
          stroke-linecap="butt"/>
  </svg>

  <!-- Clean 7-Image Grid Container (4 cols x 2 rows) -->
  <div class="absolute left-[78px] top-[210px] w-[1764px] h-[780px] grid grid-cols-4 grid-rows-2 gap-6 z-10">

    <!-- Card 1 -->
    <div class="relative w-full h-full border overflow-hidden border-[var(--color-border)] bg-white group" style="border-radius: var(--border-radius);">
      <img src="assets/support2_1.png" alt="PRÉSENTATION PPT" class="w-full h-full object-contain p-2 pb-14">
      <div class="absolute inset-x-0 bottom-0 bg-white p-4 text-center text-[var(--color-text-primary)] text-lg font-bold font-['Poppins']">
        PRÉSENTATION PPT
      </div>
    </div>

    <!-- Card 2 -->
    <div class="relative w-full h-full border overflow-hidden border-[var(--color-border)] bg-white group" style="border-radius: var(--border-radius);">
      <img src="assets/support2_2.png" alt="ROLLUP" class="w-full h-full object-contain p-2 pb-14">
      <div class="absolute inset-x-0 bottom-0 bg-white p-4 text-center text-[var(--color-text-primary)] text-lg font-bold font-['Poppins']">
        ROLLUP
      </div>
    </div>

    <!-- Card 3 -->
    <div class="relative w-full h-full border overflow-hidden border-[var(--color-border)] bg-white group" style="border-radius: var(--border-radius);">
      <img src="assets/support2_3.png" alt="AWARDING" class="w-full h-full object-contain p-2 pb-14">
      <div class="absolute inset-x-0 bottom-0 bg-white p-4 text-center text-[var(--color-text-primary)] text-lg font-bold font-['Poppins']">
        AWARDING
      </div>
    </div>

    <!-- Card 4 -->
    <div class="relative w-full h-full border overflow-hidden border-[var(--color-border)] bg-white group" style="border-radius: var(--border-radius);">
      <img src="assets/support2_4.png" alt="J-3 MÉTÉO & DRESS CODE" class="w-full h-full object-contain p-2 pb-14">
      <div class="absolute inset-x-0 bottom-0 bg-white p-4 text-center text-[var(--color-text-primary)] text-lg font-bold font-['Poppins']">
        J-3 MÉTÉO & DRESS CODE
      </div>
    </div>

    <!-- Card 5 -->
    <div class="relative w-full h-full border overflow-hidden border-[var(--color-border)] bg-white group" style="border-radius: var(--border-radius);">
      <img src="assets/support2_5.png" alt="PLAN GÉNÉRAL SITE TEAM BUILDING" class="w-full h-full object-contain p-2 pb-14">
      <div class="absolute inset-x-0 bottom-0 bg-white p-4 text-center text-[var(--color-text-primary)] text-lg font-bold font-['Poppins']">
        PLAN GÉNÉRAL SITE TEAM BUILDING
      </div>
    </div>

    <!-- Card 6 -->
    <div class="relative w-full h-full border overflow-hidden border-[var(--color-border)] bg-white group" style="border-radius: var(--border-radius);">
      <img src="assets/support2_6.png" alt="BADGE" class="w-full h-full object-contain p-2 pb-14">
      <div class="absolute inset-x-0 bottom-0 bg-white p-4 text-center text-[var(--color-text-primary)] text-lg font-bold font-['Poppins']">
        BADGE
      </div>
    </div>

    <!-- Card 7 -->
    <div class="col-span-2 relative w-full h-full border overflow-hidden border-[var(--color-border)] bg-white group" style="border-radius: var(--border-radius);">
      <img src="assets/support2_7.png" alt="SCORING TEAM BUILDING" class="w-full h-full object-contain p-2 pb-14">
      <div class="absolute inset-x-0 bottom-0 bg-white p-4 text-center text-[var(--color-text-primary)] text-lg font-bold font-['Poppins']">
        SCORING TEAM BUILDING
      </div>
    </div>

  </div>

  <!-- Tendencia logo bottom-left -->
  <div class="absolute bottom-10 left-10 z-20">
    <img src="assets/logo-black.svg" alt="Tendencia Events & Travel" class="h-24">
  </div>

  <!-- Decorative arrow markers bottom-right -->
  <div class="absolute bottom-8 right-16 z-10 flex items-center gap-5">
    <div class="flex">
      <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--color-text-primary)]"></div>
      <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-accent)] -ml-2"></div>
    </div>
    <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-secondary)]"></div>
    <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-primary)]"></div>
  </div>

</div>
