<!-- Slide component: Goodies (Static slide using divers-three-columns layout) -->
<div class="slide relative w-[1920px] h-[1080px] overflow-hidden bg-[var(--color-background)]" style="font-family: var(--font-body);">

  <!-- Decorative line above title -->
  <div class="absolute left-[78px] top-[50px] w-[580px] h-[3px] bg-[var(--color-text-primary)] z-10"></div>

  <!-- Slide Header -->
  <h1 class="absolute left-[78px] top-[68px] z-10 text-5xl font-bold leading-[1.05]" style="font-family: var(--font-heading);">
    <span class="text-[var(--color-text-primary)]" data-field="title">GOODIES</span>
  </h1>
  <svg width="300" height="24" viewBox="0 0 300 24" xmlns="http://www.w3.org/2000/svg" class="absolute left-[78px] top-[125px] z-10">
    <path d="M0,18 C75,7 225,7 300,18"
          fill="none"
          stroke="var(--color-text-primary)"
          stroke-width="13"
          stroke-linecap="butt"/>
  </svg>

  <!-- Three-Column Layout Grid (exact divers-three-columns layout) -->
  <div class="absolute left-[78px] top-[210px] w-[1764px] h-[780px] grid grid-cols-3 gap-8 z-10">

    <!-- Column 1: GADGETS PERSONNALISÉS (5 images) -->
    <div class="flex flex-col bg-white border border-[var(--color-border)] shadow-md overflow-hidden transition-all duration-300" style="border-radius: var(--border-radius);">
      <!-- Column Image Area (Expanded height h-[710px]) -->
      <div class="h-[710px] w-full p-2.5 bg-[var(--color-surface)] relative border-b border-[var(--color-border)] flex flex-col justify-between gap-2">
        <div class="h-[320px] w-full rounded overflow-hidden shadow-sm">
          <img src="assets/gadgets1.png" alt="Gadgets 1" class="w-full h-full object-contain p-1">
        </div>
        <div class="grid grid-cols-2 gap-2 h-[370px]">
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/gadgets2.png" alt="Gadgets 2" class="w-full h-full object-contain p-1">
          </div>
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/gadgets3.png" alt="Gadgets 3" class="w-full h-full object-contain p-1">
          </div>
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/gadgets4.png" alt="Gadgets 4" class="w-full h-full object-contain p-1">
          </div>
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/gadgets5.png" alt="Gadgets 5" class="w-full h-full object-contain p-1">
          </div>
        </div>
      </div>
      <!-- Column Content -->
      <div class="p-2 flex flex-col justify-center items-center flex-1 bg-white text-center">
        <h2 class="text-lg font-bold text-[var(--color-text-primary)] leading-tight" style="font-family: var(--font-heading);">
          GADGETS PERSONNALISÉS
        </h2>
      </div>
    </div>

    <!-- Column 2: TROPHÉES ÉVÉNEMENT SUR MESURE (2 images) -->
    <div class="flex flex-col bg-white border border-[var(--color-border)] shadow-md overflow-hidden transition-all duration-300" style="border-radius: var(--border-radius);">
      <!-- Column Image Area (Expanded height h-[710px]) -->
      <div class="h-[710px] w-full p-2.5 bg-[var(--color-surface)] relative border-b border-[var(--color-border)]">
        <div class="grid grid-cols-2 gap-2 h-full">
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/trophies2.png" alt="Trophée 1" class="w-full h-full object-contain p-1">
          </div>
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/trophies1.png" alt="Trophée 2" class="w-full h-full object-contain p-1">
          </div>
        </div>
      </div>
      <!-- Column Content -->
      <div class="p-2 flex flex-col justify-center items-center flex-1 bg-white text-center">
        <h2 class="text-lg font-bold text-[var(--color-text-primary)] leading-tight" style="font-family: var(--font-heading);">
          TROPHÉES ÉVÉNEMENT SUR MESURE
        </h2>
      </div>
    </div>

    <!-- Column 3: CHACHIAS & CHEICHS & BRASSARDS (5 images) -->
    <div class="flex flex-col bg-white border border-[var(--color-border)] shadow-md overflow-hidden transition-all duration-300" style="border-radius: var(--border-radius);">
      <!-- Column Image Area (Expanded height h-[710px]) -->
      <div class="h-[710px] w-full p-2.5 bg-[var(--color-surface)] relative border-b border-[var(--color-border)] flex flex-col justify-between gap-2">
        <div class="h-[320px] w-full rounded overflow-hidden shadow-sm">
          <img src="assets/accessories1.png" alt="Accessoires 1" class="w-full h-full object-contain p-1">
        </div>
        <div class="grid grid-cols-2 gap-2 h-[370px]">
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/accessories2.png" alt="Accessoires 2" class="w-full h-full object-contain p-1">
          </div>
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/accessories3.png" alt="Accessoires 3" class="w-full h-full object-contain p-1">
          </div>
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/accessories4.png" alt="Accessoires 4" class="w-full h-full object-contain p-1">
          </div>
          <div class="rounded overflow-hidden shadow-sm">
            <img src="assets/accessories5.png" alt="Accessoires 5" class="w-full h-full object-contain p-1">
          </div>
        </div>
      </div>
      <!-- Column Content -->
      <div class="p-2 flex flex-col justify-center items-center flex-1 bg-white text-center">
        <h2 class="text-lg font-bold text-[var(--color-text-primary)] leading-tight" style="font-family: var(--font-heading);">
          CHACHIAS & CHEICHS & BRASSARDS ACTIVITÉS TEAM BUILDING AVEC LOGO
        </h2>
      </div>
    </div>

  </div>

  <!-- Tendencia logo bottom-left -->
  <div class="absolute bottom-10 left-10 z-20">
    <img src="assets/logo-black.svg" alt="Tendencia Events & Travel" class="h-24">
  </div>

  <!-- Decorative arrow markers bottom-right -->
  <div class="absolute bottom-8 right-16 z-10 flex items-center gap-5">
    <div class="flex">
      <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--color-text-primary)]"></div>
      <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-accent)] -ml-2"></div>
    </div>
    <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-secondary)]"></div>
    <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-primary)]"></div>
  </div>

</div>
