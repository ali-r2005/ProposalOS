<!-- Slide component: Divers — Two-Column Layout (Title + 2 Columns with Image, Title & Paragraphs) -->
<div class="slide relative w-[1920px] h-[1080px] overflow-hidden bg-[var(--color-background)]" style="font-family: var(--font-body);">

  <!-- Decorative line above title -->
  <div class="absolute left-[78px] top-[50px] w-[580px] h-[3px] bg-[var(--color-text-primary)] z-10"></div>

  <!-- Slide Header -->
  <h1 class="absolute left-[78px] top-[68px] z-10 text-5xl font-bold leading-[1.05]" style="font-family: var(--font-heading);">
    <span class="text-[var(--brand-primary)]" data-field="title">{{#if title}}{{title}}{{else}}OFFRES & SERVICES DIVERS{{/if}}</span>
  </h1>
  <img src="assets/outline_colored.webp" alt="" class="absolute left-[78px] top-[150px] w-80 h-30 object-contain z-10">

  <!-- Two-Column Layout Grid -->
  <div class="absolute left-[78px] top-[210px] w-[1764px] h-[780px] grid grid-cols-2 gap-12 z-10">
    {{#each items}}
    <div class="flex flex-col bg-white rounded-3xl border border-[var(--color-border)] shadow-lg overflow-hidden">
      
      <!-- Column Image -->
      <div class="h-[360px] w-full overflow-hidden bg-[var(--color-surface)] relative">
        <img src="{{#if image}}{{image}}{{else}}assets/placeholder-image.svg{{/if}}" 
             alt="{{title}}" 
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
        <div class="absolute bottom-4 left-6 px-4 py-1.5 rounded-full bg-[var(--brand-accent)] text-[var(--color-text-primary)] font-bold text-sm uppercase tracking-wider">
          Prestation
        </div>
      </div>

      <!-- Column Content -->
      <div class="p-9 flex flex-col flex-1 bg-white">
        <!-- Column Title -->
        <h2 class="text-3xl font-bold text-[var(--brand-blue)] mb-5 leading-tight" style="font-family: var(--font-heading);">
          {{title}}
        </h2>

        <!-- Paragraphs -->
        <div class="space-y-4 flex-1 text-[var(--color-text-primary)] text-[18px] leading-relaxed">
          {{#each paragraphes}}
          <p class="leading-relaxed">{{this}}</p>
          {{/each}}
        </div>
      </div>

    </div>
    {{/each}}
  </div>

  <!-- Tendencia logo bottom-left -->
  <div class="absolute bottom-6 left-12 z-20">
    <img src="assets/logo-black.png" alt="Tendencia Events & Travel" class="h-16 opacity-80 object-contain">
  </div>

  <!-- Decorative arrow markers bottom-right -->
  <div class="absolute bottom-8 right-16 z-10 flex items-center gap-4">
    <div class="flex">
      <div class="w-0 h-0 border-y-[16px] border-y-transparent border-l-[24px] border-l-[color:var(--color-text-primary)]"></div>
      <div class="w-0 h-0 border-y-[16px] border-y-transparent border-l-[24px] border-l-[color:var(--brand-accent)] -ml-2"></div>
    </div>
    <div class="w-0 h-0 border-y-[16px] border-y-transparent border-l-[24px] border-l-[color:var(--brand-secondary)]"></div>
    <div class="w-0 h-0 border-y-[16px] border-y-transparent border-l-[24px] border-l-[color:var(--brand-primary)]"></div>
  </div>

</div>
