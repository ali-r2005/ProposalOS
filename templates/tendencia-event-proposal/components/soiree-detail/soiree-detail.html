<!-- Slide component: Soirée / gala detail ("ATLAS CAPITAL GALA — TANGER SPIRIT") — text left, single image right -->
<div class="slide relative w-[1920px] h-[1080px] overflow-hidden bg-[var(--color-background)]" style="font-family: var(--font-body);">

  <!-- Right: photo collage (conditional 4, 3, 2, or 1 image layout) -->
  {{#if images.[3]}}
  <!-- 4-Image Grid Layout -->
  <div class="absolute z-10 bg-white p-[8px] border border-[var(--color-border)] shadow-md" style="left: 1040px; top: 220px; width: 390px; height: 310px; transform: rotate(-1.5deg); border-radius: var(--border-radius);">
    <img src="{{images.[0]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>
  <div class="absolute z-10 bg-white p-[8px] border border-[var(--color-border)] shadow-md" style="left: 1450px; top: 215px; width: 390px; height: 310px; transform: rotate(1.5deg); border-radius: var(--border-radius);">
    <img src="{{images.[1]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>
  <div class="absolute z-10 bg-white p-[8px] border border-[var(--color-border)] shadow-md" style="left: 1040px; top: 550px; width: 390px; height: 310px; transform: rotate(1deg); border-radius: var(--border-radius);">
    <img src="{{images.[2]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>
  <div class="absolute z-10 bg-white p-[8px] border border-[var(--color-border)] shadow-md" style="left: 1450px; top: 545px; width: 390px; height: 310px; transform: rotate(-1deg); border-radius: var(--border-radius);">
    <img src="{{images.[3]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>

  {{else}}{{#if images.[2]}}
  <!-- 3-Image Layout -->
  <div class="absolute z-10 bg-white p-[10px] border border-[var(--color-border)] shadow-md" style="left: 1040px; top: 220px; width: 420px; height: 320px; transform: rotate(-2deg); border-radius: var(--border-radius);">
    <img src="{{images.[0]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>
  <div class="absolute z-10 bg-white p-[10px] border border-[var(--color-border)] shadow-md" style="left: 1040px; top: 560px; width: 420px; height: 320px; transform: rotate(2deg); border-radius: var(--border-radius);">
    <img src="{{images.[1]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>
  <div class="absolute z-10 bg-white p-[10px] border border-[var(--color-border)] shadow-md" style="left: 1480px; top: 240px; width: 370px; height: 620px; transform: rotate(1.5deg); border-radius: var(--border-radius);">
    <img src="{{images.[2]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>

  {{else}}{{#if images.[1]}}
  <!-- 2-Image Layout -->
  <div class="absolute z-10 bg-white p-[10px] border border-[var(--color-border)] shadow-md" style="left: 1060px; top: 220px; width: 780px; height: 310px; transform: rotate(-1deg); border-radius: var(--border-radius);">
    <img src="{{images.[0]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>
  <div class="absolute z-10 bg-white p-[10px] border border-[var(--color-border)] shadow-md" style="left: 1060px; top: 550px; width: 780px; height: 310px; transform: rotate(1deg); border-radius: var(--border-radius);">
    <img src="{{images.[1]}}" alt="{{name}}" class="w-full h-full object-cover block" style="border-radius: calc(var(--border-radius) - 2px);">
  </div>

  {{else}}
  <!-- 1-Image Layout (Full-bleed right image fallback) -->
  <img src="{{#if image}}{{image}}{{else}}{{#if images.[0]}}{{images.[0]}}{{else}}assets/placeholder-image.svg{{/if}}{{/if}}" alt="{{name}}" data-field="soiree-image"
       class="absolute top-0 right-0 h-[1080px] w-[960px] object-cover z-0">
  {{/if}}{{/if}}{{/if}}

  <!-- Title -->
  <div class="absolute left-[78px] top-[50px] w-[580px] h-[3px] bg-[var(--color-text-primary)] z-10"></div>
  <h1 class="absolute left-[78px] top-[68px] z-10 text-5xl font-bold leading-[1.12]" style="font-family: var(--font-heading);">
    <span class="text-[var(--brand-primary)]" data-field="soiree-name">{{name}}</span><br>
    <span class="text-[var(--color-text-primary)]" data-field="soiree-subtitle">{{subtitle}}</span>
  </h1>
  <img src="assets/outline_primary.webp" alt="" class="absolute left-[78px] top-[172px] w-80 h-30 object-contain z-0">

  <!-- Left: description (one paragraph per entry) -->
  <div class="absolute left-[78px] top-[300px] w-[820px] z-10 space-y-5 text-[18px] leading-[1.5] text-[var(--color-text-primary)]" data-field="soiree-description">
    {{#each description}}
    <p>{{this}}</p>
    {{/each}}
  </div>

  <!-- Tendencia logo, bottom-left -->
  <div class="absolute bottom-12 left-16 z-10">
    <img src="assets/logo-blue.png" alt="Tendencia Events & Travel" class="h-24">
  </div>

  <!-- Decorative arrow markers, bottom (near text/image boundary) -->
  <div class="absolute bottom-9 left-[720px] z-10 flex items-center gap-6">
    <div class="flex">
      <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--color-text-primary)]"></div>
      <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-accent)] -ml-2"></div>
    </div>
    <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-secondary)]"></div>
    <div class="w-0 h-0 border-y-[20px] border-y-transparent border-l-[30px] border-l-[color:var(--brand-primary)]"></div>
  </div>

</div>
